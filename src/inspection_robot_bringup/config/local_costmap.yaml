# Standalone Local Costmap configuration.
#
# Used for component-level debugging and rolling-window tests.
# The integrated Nav2 system uses the local_costmap
# configuration embedded in controller.yaml.

costmap:
  costmap:
    ros__parameters:

      use_sim_time: true

      # =========================
      # 坐标系
      # =========================
      global_frame: odom
      robot_base_frame: base_footprint

      # =========================
      # Local Costmap
      # =========================
      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true

      width: 3
      height: 3
      resolution: 0.05

      track_unknown_space: false

      # =========================
      # Robot footprint
      # =========================
      footprint: "[[0.12, 0.12],
                   [0.12, -0.12],
                   [-0.20, -0.12],
                   [-0.20, 0.12]]"

      footprint_padding: 0.01

      # =========================
      # Layers
      # =========================
      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          clearing: true
          marking: true

          obstacle_min_range: 0.12
          obstacle_max_range: 2.5

          raytrace_min_range: 0.12
          raytrace_max_range: 3.0

          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.35
        cost_scaling_factor: 3.0