# Standalone Global Costmap configuration.
#
# Used for component-level debugging and teaching.
# The integrated Nav2 system uses the global_costmap
# configuration embedded in planner.yaml.

costmap:
  costmap:
    ros__parameters:

      use_sim_time: true

      global_frame: map
      robot_base_frame: base_footprint

      update_frequency: 5.0
      publish_frequency: 2.0

      resolution: 0.05
      rolling_window: false
      track_unknown_space: true

      footprint: "[[0.12, 0.12],
                   [0.12, -0.12],
                   [-0.20, -0.12],
                   [-0.20, 0.12]]"

      footprint_padding: 0.01

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true

          obstacle_min_range: 0.12
          obstacle_max_range: 7.5

          raytrace_min_range: 0.12
          raytrace_max_range: 8.0

          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 3.0